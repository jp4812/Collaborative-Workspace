<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Collaborative Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- Top Navigation Bar -->
    <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center border-b border-gray-200">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-extrabold tracking-tight text-indigo-600">Nexus</span>
            <span id="userRoleBadge"
                class="text-xs px-2.5 py-0.5 rounded-full font-medium bg-gray-100 text-gray-800"></span>
        </div>
        <div class="flex items-center space-x-4">
            <span id="userName" class="text-sm font-medium text-gray-600"></span>
            <button id="logoutBtn"
                class="text-sm bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-md font-medium transition">
                Logout
            </button>
        </div>
    </nav>

    <!-- Main Grid Layout -->
    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Left Column: Workspaces & Admin Operations -->
        <section class="md:col-span-1 space-y-6">

            <!-- Provision Employee Account (Visible ONLY to Admin) -->
            <div id="adminCreateEmployeeCard" class="bg-white p-5 rounded-lg shadow-sm border border-purple-100 hidden">
                <h2 class="text-xs font-bold uppercase tracking-wider text-purple-700 mb-3">Provision Employee</h2>
                <form id="createEmployeeForm" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Full Name</label>
                        <input type="text" id="empName" required
                            class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-purple-500 focus:outline-none"
                            placeholder="e.g. Rahul Sharma">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Corporate Email
                            (@emp.nexus.in)</label>
                        <input type="email" id="empEmail" required
                            class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-purple-500 focus:outline-none"
                            placeholder="rahul@emp.nexus.in">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Initial Password</label>
                        <input type="password" id="empPassword" required
                            class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-purple-500 focus:outline-none"
                            placeholder="••••••••">
                    </div>
                    <button type="submit"
                        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 rounded-md text-sm transition">
                        Provision Account
                    </button>
                </form>
                <p id="empMsg" class="text-xs mt-2 hidden"></p>
            </div>

            <!-- Create Workspace Card (Visible ONLY to Admin) -->
            <div id="adminCreateWorkspaceCard"
                class="bg-white p-5 rounded-lg shadow-sm border border-indigo-100 hidden">
                <h2 class="text-xs font-bold uppercase tracking-wider text-indigo-700 mb-3">Create Workspace</h2>
                <form id="createWorkspaceForm" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Workspace Name</label>
                        <input type="text" id="wsName" required
                            class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                            placeholder="e.g. Core Engineering">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Description</label>
                        <textarea id="wsDesc" rows="2"
                            class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                            placeholder="Goals & deliverables..."></textarea>
                    </div>
                    <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-md text-sm transition">
                        + Create Workspace
                    </button>
                </form>
            </div>

            <!-- Workspaces List -->
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                <h2 class="text-xs font-bold uppercase tracking-wider text-gray-700 mb-3">Your Workspaces</h2>
                <div id="workspaceList" class="space-y-2">
                    <p class="text-sm text-gray-500">Loading workspaces...</p>
                </div>
            </div>

        </section>

        <!-- Right Column: Task Board & Actions -->
        <section class="md:col-span-2 space-y-6">

            <!-- Workspace Header -->
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h1 id="currentWorkspaceTitle" class="text-xl font-bold text-gray-900">Select a Workspace</h1>
                        <p id="currentWorkspaceDesc" class="text-sm text-gray-500">Choose a workspace from the left to
                            inspect its board.</p>
                    </div>
                    <div class="flex items-center space-x-2" id="workspaceActionButtons">
                        <button id="openMemberModalBtn"
                            class="hidden bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium px-3 py-2 rounded-md transition">
                            + Invite Member
                        </button>
                        <button id="openTaskFormBtn"
                            class="hidden bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-md transition">
                            + Add Task
                        </button>
                    </div>
                </div>

                <!-- Collapsible Member Invite Form -->
                <div id="addMemberSection" class="hidden mt-4 pt-4 border-t border-gray-100">
                    <form id="inviteMemberForm" class="flex gap-2">
                        <input type="email" id="inviteEmail" required
                            placeholder="Employee email (e.g. rahul@emp.nexus.in)..."
                            class="flex-1 px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <button type="submit"
                            class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-2 rounded-md font-medium transition">
                            Invite
                        </button>
                    </form>
                    <p id="inviteMsg" class="text-xs mt-2 hidden"></p>
                </div>
            </div>

            <!-- Collapsible Task Creation Form -->
            <div id="addTaskSection" class="bg-white p-5 rounded-lg shadow-sm border border-gray-200 hidden">
                <h3 class="text-sm font-bold uppercase tracking-wider text-gray-700 mb-3">Create New Task</h3>
                <form id="createTaskForm" class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" id="taskTitle" placeholder="Task title" required
                        class="col-span-2 px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">

                    <select id="taskPriority"
                        class="px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                        <option value="Low">Low Priority</option>
                        <option value="Medium" selected>Medium Priority</option>
                        <option value="High">High Priority</option>
                    </select>

                    <select id="taskAssignee"
                        class="px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                        <option value="">Unassigned</option>
                    </select>

                    <input type="text" id="taskDesc" placeholder="Task description (optional)"
                        class="col-span-3 px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">

                    <button type="submit"
                        class="col-span-1 bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded-md text-sm transition">
                        Save Task
                    </button>
                </form>
            </div>

            <!-- Kanban Columns (HTML5 Drag & Drop) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="kanbanBoard">

                <!-- To Do Column -->
                <div class="bg-gray-50 border border-gray-200 rounded-lg p-3 flex flex-col kanban-col"
                    data-status="To Do">
                    <div class="flex items-center justify-between mb-3 px-1">
                        <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wider">To Do</h3>
                        <span id="count-todo"
                            class="text-xs bg-gray-200 text-gray-700 font-semibold px-2 py-0.5 rounded-full">0</span>
                    </div>
                    <div id="col-todo" class="space-y-3 min-h-[380px] transition-colors rounded-md p-1"></div>
                </div>

                <!-- In Progress Column -->
                <div class="bg-gray-50 border border-gray-200 rounded-lg p-3 flex flex-col kanban-col"
                    data-status="In Progress">
                    <div class="flex items-center justify-between mb-3 px-1">
                        <h3 class="text-xs font-bold text-indigo-700 uppercase tracking-wider">In Progress</h3>
                        <span id="count-inprogress"
                            class="text-xs bg-indigo-100 text-indigo-700 font-semibold px-2 py-0.5 rounded-full">0</span>
                    </div>
                    <div id="col-inprogress" class="space-y-3 min-h-[380px] transition-colors rounded-md p-1"></div>
                </div>

                <!-- Completed Column -->
                <div class="bg-gray-50 border border-gray-200 rounded-lg p-3 flex flex-col kanban-col"
                    data-status="Completed">
                    <div class="flex items-center justify-between mb-3 px-1">
                        <h3 class="text-xs font-bold text-green-700 uppercase tracking-wider">Completed</h3>
                        <span id="count-completed"
                            class="text-xs bg-green-100 text-green-700 font-semibold px-2 py-0.5 rounded-full">0</span>
                    </div>
                    <div id="col-completed" class="space-y-3 min-h-[380px] transition-colors rounded-md p-1"></div>
                </div>

            </div>

        </section>

    </main>

    <!-- Edit Task Modal (Admin Only) -->
    <div id="editTaskModal"
        class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white w-full max-w-lg rounded-xl shadow-xl border border-gray-200 p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 class="text-lg font-bold text-gray-900">Edit Task Details</h3>
                <button id="closeEditModalBtn" class="text-gray-400 hover:text-gray-600 text-lg font-bold">✕</button>
            </div>

            <form id="editTaskForm" class="space-y-4">
                <input type="hidden" id="editTaskId">

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Title</label>
                    <input type="text" id="editTaskTitle" required
                        class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Priority</label>
                        <select id="editTaskPriority"
                            class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Assignee</label>
                        <select id="editTaskAssignee"
                            class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                            <option value="">Unassigned</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Description</label>
                    <textarea id="editTaskDesc" rows="3"
                        class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <div class="flex justify-end space-x-2 pt-2 border-t border-gray-100">
                    <button type="button" id="cancelEditModalBtn"
                        class="px-4 py-2 border border-gray-300 text-gray-700 rounded-md text-sm hover:bg-gray-50 transition">Cancel</button>
                    <button type="submit"
                        class="px-4 py-2 bg-indigo-600 text-white font-medium rounded-md text-sm hover:bg-indigo-700 transition">Save
                        Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/dashboard.js"></script>
</body>

</html>
