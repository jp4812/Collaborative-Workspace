<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Collaborative Workspace</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center border-b border-gray-200">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold tracking-tight text-indigo-600">Nexus</span>
            <span id="userRoleBadge"
                class="text-xs px-2.5 py-0.5 rounded-full font-medium bg-gray-100 text-gray-800"></span>
        </div>
        <div class="flex items-center space-x-4">
            <span id="userName" class="text-sm font-medium text-gray-600"></span>
            <button id="logoutBtn"
                class="text-sm bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-md font-medium transition">
                Logout
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Left Column: Workspaces List & Creation Form -->
        <section class="md:col-span-1 space-y-6">

            <!-- Create Workspace Card (Visible to Admin only) -->
            <div id="adminCreateWorkspaceCard" class="bg-white p-5 rounded-lg shadow-sm border border-gray-200 hidden">
                <h2 class="text-lg font-semibold mb-3">Create Workspace</h2>
                <form id="createWorkspaceForm" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Name</label>
                        <input type="text" id="wsName" required
                            class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                            placeholder="e.g. Frontend Team">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Description</label>
                        <textarea id="wsDesc" rows="2"
                            class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                            placeholder="Project goals..."></textarea>
                    </div>
                    <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-md text-sm transition">
                        + Create Workspace
                    </button>
                </form>
            </div>

            <!-- Workspaces List -->
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                <h2 class="text-lg font-semibold mb-3">Your Workspaces</h2>
                <div id="workspaceList" class="space-y-2">
                    <p class="text-sm text-gray-500">Loading workspaces...</p>
                </div>
            </div>

        </section>

        <!-- Right Column: Task Management Board -->
        <section class="md:col-span-2 space-y-6">

            <!-- Selected Workspace Header -->
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200 flex justify-between items-center">
                <div>
                    <h1 id="currentWorkspaceTitle" class="text-xl font-bold">Select a Workspace</h1>
                    <p id="currentWorkspaceDesc" class="text-sm text-gray-500">Click a workspace on the left to inspect
                        its tasks.</p>
                </div>
                <button id="openTaskFormBtn"
                    class="hidden bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-md transition">
                    + Add Task
                </button>
            </div>

            <!-- Quick Add Task Form (Collapsible) -->
            <div id="addTaskSection" class="bg-white p-5 rounded-lg shadow-sm border border-gray-200 hidden">
                <h3 class="text-md font-semibold mb-3">New Task</h3>
                <form id="createTaskForm" class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" id="taskTitle" placeholder="Task title" required
                        class="col-span-2 px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <select id="taskPriority"
                        class="px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="Low">Low Priority</option>
                        <option value="Medium" selected>Medium Priority</option>
                        <option value="High">High Priority</option>
                    </select>
                    <input type="text" id="taskDesc" placeholder="Task description (optional)"
                        class="col-span-3 px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <button type="submit"
                        class="col-span-1 bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded-md text-sm transition">
                        Save Task
                    </button>
                </form>
            </div>

            <!-- Tasks Cards Container -->
            <div id="taskList" class="space-y-3">
                <!-- Dynamically populated tasks -->
            </div>

        </section>

    </main>

    <script src="/js/dashboard.js"></script>
</body>

</html>
