<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Enterprise Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-xl border border-gray-200 shadow-sm">
        <div class="text-center">
            <div
                class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-indigo-50 text-indigo-600 font-extrabold text-2xl mb-2">
                N
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-gray-900">Nexus Workspace</h1>
            <p class="text-xs text-gray-500 mt-1 uppercase tracking-wider font-semibold">Authorized Personnel Only</p>
        </div>

        <!-- Error Alert Box -->
        <div id="errorAlert" class="hidden p-3 text-xs text-red-700 bg-red-50 rounded-md border border-red-200"></div>

        <form id="signinForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Corporate Email</label>
                <input type="email" id="email" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="name@emp.nexus.in or name@admin.nexus.in">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
                <input type="password" id="password" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-md transition duration-150 shadow-sm">
                Sign In to Nexus
            </button>
        </form>

        <div class="border-t border-gray-100 pt-4 text-center">
            <p class="text-xs text-gray-400 leading-relaxed">
                Corporate accounts require authorization under <strong>@emp.nexus.in</strong> or
                <strong>@admin.nexus.in</strong>. Contact IT to request provisioned credentials.
            </p>
        </div>
    </div>

    <script>
        document.getElementById('signinForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.classList.add('hidden');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    errorAlert.textContent = data.message || 'Authentication failed.';
                    errorAlert.classList.remove('hidden');
                    return;
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/dashboard.html';
            } catch (err) {
                errorAlert.textContent = 'Server connection failed. Verify backend is active.';
                errorAlert.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
