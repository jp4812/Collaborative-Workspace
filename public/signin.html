<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Enterprise Sign In</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/images/logo-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Questrial&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style type="text/tailwindcss">
        @theme {
            --color-primary: #4f46e5;
            --color-primary-hover: #4338ca;
            --color-primary-light: #eef2ff;
            --color-purple: #9333ea;
            --color-purple-hover: #7e22ce;
            --color-purple-light: #f3e8ff;
            --color-emerald: #059669;
            --color-emerald-hover: #047857;
            --color-emerald-light: #d1fae5;
            --color-danger: #dc2626;
            --color-danger-light: #fef2f2;
            --font-sans: 'Inter', 'Questrial', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 sm:p-6">

    <div class="card w-full max-w-md p-6 sm:p-8 space-y-6 shadow-md">
        <div class="text-center">
            <img src="/images/logo.png" alt="Nexus Logo" class="inline-block w-14 h-14 rounded-2xl shadow-md mb-2.5 object-cover">
            <h1 class="text-2xl font-extrabold tracking-tight text-gray-900">Nexus Workspace</h1>
            <p class="text-xs text-gray-500 mt-1 uppercase tracking-wider font-semibold">Authorized Personnel Only</p>
        </div>

        <!-- Error Alert Box -->
        <div id="errorAlert" class="hidden p-3 text-xs text-red-700 bg-red-50 rounded-md border border-red-200"></div>

        <form id="signinForm" class="space-y-4">
            <div>
                <label class="form-label">Corporate Email</label>
                <input type="email" id="email" required class="form-input"
                    placeholder="name@emp.nexus.in or name@admin.nexus.in">
            </div>

            <div>
                <label class="form-label">Password</label>
                <input type="password" id="password" required class="form-input" placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary w-full py-2.5">
                <i class="bi bi-box-arrow-in-right mr-1.5"></i> Sign In to Nexus
            </button>
        </form>

        <div class="border-t border-gray-100 pt-4 text-center">
            <p class="text-xs text-gray-400 leading-relaxed">
                Corporate accounts require authorization under <strong>@emp.nexus.in</strong> or
                <strong>@admin.nexus.in</strong>. Contact IT to request provisioned credentials.
            </p>
        </div>
    </div>

    <script>
        document.getElementById('signinForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.classList.add('hidden');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    errorAlert.textContent = data.message || 'Authentication failed.';
                    errorAlert.classList.remove('hidden');
                    return;
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/dashboard.html';
            } catch (err) {
                errorAlert.textContent = 'Server connection failed. Verify backend is active.';
                errorAlert.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
