<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg border border-gray-200 shadow-sm">
        <div class="text-center">
            <h1 class="text-2xl font-bold tracking-tight text-indigo-600">Nexus</h1>
            <p class="text-sm text-gray-500 mt-1">Create your Nexus account</p>
        </div>

        <!-- Error Banner -->
        <div id="errorAlert" class="hidden p-3 text-sm text-red-700 bg-red-100 rounded-md border border-red-200"></div>

        <form id="signupForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Full Name</label>
                <input type="text" id="name" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="Jane Doe">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Email</label>
                <input type="email" id="email" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="jane@test.com">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
                <input type="password" id="password" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="••••••••">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Account Role</label>
                <select id="role"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                    <option value="Member" selected>Member (Standard access)</option>
                    <option value="Admin">Admin (Can create workspaces)</option>
                </select>
            </div>

            <button type="submit"
                class="w-full py-2 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-md transition duration-150">
                Register Account
            </button>
        </form>

        <div class="text-center text-xs text-gray-500">
            Already have an account?
            <a href="/signin.html" class="text-indigo-600 hover:underline font-medium">Sign in</a>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            var errorAlert = document.getElementById('errorAlert');
            errorAlert.classList.add('hidden');

            var name = document.getElementById('name').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var role = document.getElementById('role').value;

            try {
                var res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, email: email, password: password, role: role })
                });

                var data = await res.json();

                if (!res.ok) {
                    errorAlert.textContent = data.message || 'Registration failed';
                    errorAlert.classList.remove('hidden');
                    return;
                }

                // Automatic redirect to signin
                window.location.href = '/signin.html';
            } catch (err) {
                errorAlert.textContent = 'Network error. Make sure your server is running.';
                errorAlert.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
